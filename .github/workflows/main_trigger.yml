name: Run tests maven with trigger
'on':
  repository_dispatch:
    types:
      - my-event
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Chechout
        uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn test
      - name: Clean previous Allure results and report
        run: rm -rf target/allure-results
      - name: Generate Allure Report
        if: always()
        continue-on-error : true
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        continue-on-error : true
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: '${{ secrets.REPO_A }}'
          publish_dir: ./allure-report
          publish_branch: allure-report
          keep_files: false
         
  job2:
      runs-on: ubuntu-latest
      needs: job1
      if: always()
      steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: allure-report
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read JSON file
        run: |
          JSON_DATA=$(cat ./widgets/suites.json)
          echo "Full JSON: $JSON_DATA"
      - name: Extract value from JSON
        run: |
          Total=$(jq -r '.items[0].statistic.total' ./widgets/suites.json)
          Fail=$(jq -r '.items[0].statistic.failed' ./widgets/suites.json)
          Pass=$(jq -r '.items[0].statistic.passed' ./widgets/suites.json)
          echo "Extracted Value: $Total"
          echo "Extracted Value: $Fail"
          echo "Extracted Value: $Pass"
           echo "total_testcase=$Total" >> $GITHUB_ENV
           echo "fail_testcase=$Fail" >> $GITHUB_ENV
           echo "pass_testcase=$Pass" >> $GITHUB_ENV


      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: '${{ secrets.SMTP_USERNAME }}'
          password: '${{ secrets.SMTP_PASSWORD }}'
          subject: GitHub Actions Test Email
          from: '${{ secrets.SMTP_USERNAME }}'
          to: tharakaindradasa93@gmail.com
          content_type: text/html
          body: |
          
           <!DOCTYPE html>
            <html>
            <head>
              <title>HTML Email</title>
            </head>
            <body>
              <h1 style="color:blue;">Hello from GitHub Actions!</h1>
              <p>This is an email sent from a GitHub Actions workflow.</p>
              <p>Here's a link: <a href="https://github.com">Visit GitHub</a></p>
              <p><strong>Enjoy your day!</strong></p>
            </body>
            </html>
         
           
          
         
