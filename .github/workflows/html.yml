name: Generate HTML

on: [push]

jobs:
  generate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write HTML to file
        run: |
          echo "
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test HTML</title>
          </head>
          <body>
              <h1>Hello, World!</h1>
              <p>This HTML was generated in a GitHub Actions workflow.</p>
          </body>
          </html>
          " > test.html

      - name: Display HTML content
        run: cat test.html
